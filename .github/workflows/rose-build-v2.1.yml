name: Build Rose Performance Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract Rose v2.1 source
        run: |
          rm -rf extracted
          unzip -q RosePerformanceEngine-2.1.0-fixed-source.zip -d extracted

      - name: Fix Minecraft 26.1 settings
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          if [ -f settings.gradle ]; then
            sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' settings.gradle
          fi

      - name: Verify source
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          test -f src/main/java/com/rose/fpsboost/RoseFpsBooster.java
          test ! -f src/main/java/com/rose/fpsboost/mixin/MinecraftClientMixin.java
          test ! -f src/main/resources/rose_fps_booster.mixins.json
          grep -q 'mod_version=2.1.0' gradle.properties
          grep -q 'fabric-api' build.gradle

      - name: Check Gradle configuration
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          gradle tasks --no-daemon --refresh-dependencies

      - name: Build mod
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          gradle clean build --no-daemon --refresh-dependencies

      - name: Verify JAR contents
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          ls -lah build/libs/
          JAR=$(find build/libs -maxdepth 1 -type f -name 'rose-performance-engine-2.1.0.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'com/rose/fpsboost/RoseFpsBooster.class'
          jar tf "$JAR" | grep -q 'com/rose/fpsboost/PerformanceController.class'
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          if jar tf "$JAR" | grep -q 'MinecraftClientMixin.class'; then
            echo "Unexpected old mixin class found"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Performance-Engine-2.1.0-MC26.1
          path: extracted/RoseFPSBooster261_Project/build/libs/rose-performance-engine-2.1.0.jar
