name: Build Minecraft AI Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-ai-assistant.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle 9.4.0
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.4.0-bin.zip
          unzip -q gradle-9.4.0-bin.zip
          echo "$PWD/gradle-9.4.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Find AI Assistant ZIP
        id: find_zip
        shell: bash
        run: |
          echo "=== MENCARI FILE ZIP ==="

          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP=$(find . -maxdepth 1 -type f \
            -iname "*minecraft-ai-assistant*.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "AI Assistant ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract AI Assistant
        shell: bash
        run: |
          rm -rf ai-assistant
          mkdir -p ai-assistant

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d ai-assistant

          echo "=== PROJECT FILES ==="
          find ai-assistant -maxdepth 5 -type f | sort

      - name: Verify Gradle project
        shell: bash
        run: |
          if [ ! -f "ai-assistant/build.gradle" ] && \
             [ ! -f "ai-assistant/build.gradle.kts" ]; then
            echo "build.gradle tidak ditemukan!"
            find ai-assistant -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Gradle project ditemukan."

      - name: Build AI Assistant
        working-directory: ai-assistant
        shell: bash
        run: |
          gradle build --no-daemon --refresh-dependencies

      - name: Show JAR
        shell: bash
        run: |
          echo "=== JAR HASIL BUILD ==="
          find ai-assistant/build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-assistant-26.1
          path: ai-assistant/build/libs/*.jar
          if-no-files-found: error
