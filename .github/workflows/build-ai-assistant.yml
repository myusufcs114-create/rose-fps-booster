name: Build Minecraft AI Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - "minecraft-ai-assistant-26.1-github.zip"
      - ".github/workflows/build-ai-assistant.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle 9.4.0
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.4.0-bin.zip
          unzip -q gradle-9.4.0-bin.zip
          echo "$PWD/gradle-9.4.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Find AI Assistant ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f \
            -name "minecraft-ai-assistant-26.1-github.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "AI Assistant ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract AI Assistant
        shell: bash
        run: |
          rm -rf ai-assistant
          mkdir -p ai-assistant
          unzip -o "${{ steps.find_zip.outputs.zip }}" -d ai-assistant

          find ai-assistant -maxdepth 4 -type f | sort

      - name: Configure repositories
        working-directory: ai-assistant
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = "Fabric"
                      url = uri("https://maven.fabricmc.net/")
                  }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  maven {
                      name = "Fabric"
                      url = uri("https://maven.fabricmc.net/")
                  }

                  maven {
                      name = "Mojang"
                      url = uri("https://libraries.minecraft.net/")
                  }

                  mavenCentral()
              }
          }

          rootProject.name = "MinecraftAIAssistant"
          EOF

          echo "=== NEW settings.gradle ==="
          cat settings.gradle

      - name: Verify Gradle project
        shell: bash
        run: |
          test -f ai-assistant/build.gradle || test -f ai-assistant/build.gradle.kts

      - name: Build AI Assistant
        working-directory: ai-assistant
        run: |
          gradle build --no-daemon --refresh-dependencies

      - name: Show JAR
        shell: bash
        run: |
          echo "=== JAR HASIL BUILD ==="
          find ai-assistant/build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-assistant-26.1
          path: ai-assistant/build/libs/*.jar
          if-no-files-found: error
