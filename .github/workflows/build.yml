name: Build Rose FPS Booster

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract project
        run: |
          unzip -q RoseFPSBooster-26.1-source.zip -d extracted

      - name: Fix build.gradle
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          sed -i '/mappings loom\.officialMojangMappings()/d' build.gradle
          sed -i 's/implementation "net\.fabricmc:fabric-loader:/modImplementation "net.fabricmc:fabric-loader:/' build.gradle
          echo "Updated build.gradle:"
          cat build.gradle

      - name: Build mod
        working-directory: extracted/RoseFPSBooster261_Project
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rose-FPS-Booster-26.1
          path: extracted/RoseFPSBooster261_Project/build/libs/*.jar
