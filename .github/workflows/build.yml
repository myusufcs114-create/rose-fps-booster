name: Build Rose FPS Booster

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract project
        run: |
          unzip -q RoseFPSBooster-26.1-source.zip -d extracted

      - name: Fix Minecraft 26.1 build.gradle
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          # Loom 26.1+
          sed -i "s/id ['\"]fabric-loom['\"]/id 'net.fabricmc.fabric-loom'/g" build.gradle

          # 26.1 uses normal Gradle dependency configurations
          sed -i 's/modImplementation/implementation/g' build.gradle
          sed -i 's/modCompileOnly/compileOnly/g' build.gradle
          sed -i 's/modApi/api/g' build.gradle

          # 26.1 does not use a mappings dependency line
          sed -i '/^[[:space:]]*mappings[[:space:]]/d' build.gradle

          # Non-remapping Loom uses jar instead of remapJar
          sed -i 's/remapJar/jar/g' build.gradle

          echo "===== FINAL build.gradle ====="
          cat build.gradle
          echo "=============================="

      - name: Build mod
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          gradle clean build --no-daemon --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rose-FPS-Booster-26.1
          path: extracted/RoseFPSBooster261_Project/build/libs/*.jar
