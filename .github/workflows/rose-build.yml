name: Build Rose Performance Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract Rose v2 source
        run: |
          unzip -q RosePerformanceEngine-2.0.0-source.zip -d extracted

      - name: Fix Minecraft 26.1 settings
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          if [ -f settings.gradle ]; then
            sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' settings.gradle
          fi

      - name: Check Gradle configuration
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          gradle tasks --no-daemon --refresh-dependencies

      - name: Build mod
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          gradle clean build --no-daemon --refresh-dependencies

      - name: Show build output
        working-directory: extracted/RoseFPSBooster261_Project
        run: |
          echo "===== BUILD LIBS ====="
          ls -lah build/libs/
          echo "======================"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Performance-Engine-2.0.0-MC26.1
          path: extracted/RoseFPSBooster261_Project/build/libs/*.jar
